name: {{NOME_MONITOR}}

on:
  schedule:
    # minuto "storto" (non :00): i cron allo scoccare dell'ora partono in ritardo
    - cron: "17 5 * * *"      # run completo + riepilogo ({{ORA_LOCALE}})
    - cron: "17 12,19 * * *"  # run leggeri (solo le fonti veloci)
  workflow_dispatch:
    inputs:
      sources:
        description: "Fonti (all oppure es. {{FONTE_1}},{{FONTE_2}})"
        default: all
      digest:
        description: "Invia anche il riepilogo delle offerte valide"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: {{NOME_REPO}}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # ultima versione, compresi i dati salvati dai run precedenti

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          # python -m playwright install --with-deps chromium   # solo se serve un browser

      - name: Test
        run: python -m pytest -q

      - name: Cerca prezzi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # API_KEY_SERVIZIO: ${{ secrets.API_KEY_SERVIZIO }}   # eventuali chiavi
          SOURCES: ${{ github.event.inputs.sources || (github.event.schedule == '17 12,19 * * *' && '{{FONTE_1}},{{FONTE_2}}') || 'all' }}
          DIGEST: ${{ (github.event.schedule == '17 5 * * *' || github.event.inputs.digest == 'true') && '--digest' || '' }}
        run: python monitor.py --sources "$SOURCES" $DIGEST

      - name: Salva dati
        if: always()
        run: |
          git config user.name "{{NOME_REPO}}-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aggiorna dati $(date -u '+%Y-%m-%d %H:%M')"
          # se un altro run ha salvato nel frattempo, riprova (in caso di conflitto vincono i dati di questo run)
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
