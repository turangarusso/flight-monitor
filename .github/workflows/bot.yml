name: Bot Telegram

on:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/bot.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        working-directory: bot
        run: node --test

      - name: Controlla i secret
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Bot non pubblicato: manca il secret CLOUDFLARE_API_TOKEN (vedi README)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '"::notice::Token Cloudflare: " + .result.status'
          # l'Account ID si ricava dal token se non è stato impostato come secret
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            CLOUDFLARE_ACCOUNT_ID=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ "$CLOUDFLARE_ACCOUNT_ID" = "null" ]; then
            echo "::error::Account ID non trovato: il token deve avere i permessi del modello 'Edit Cloudflare Workers'"
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # il segreto del webhook è derivato dal token del bot: nessun secret in più da creare
      - name: Prepara il segreto del webhook
        if: steps.check.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          s=$(printf '%s' "flight-monitor:$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          echo "::add-mask::$s"
          echo "WEBHOOK_SECRET=$s" >> "$GITHUB_ENV"

      - name: Pubblica il Worker
        if: steps.check.outputs.ready == 'true'
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # in caso di errore il messaggio di Cloudflare finisce nelle annotazioni del run
          run() { "$@" > out.txt 2>&1 || { cat out.txt; echo "::error::$(tail -c 1500 out.txt | tr '\n' ' ')"; exit 1; }; cat out.txt; }
          run npx --yes wrangler@3 deploy
          for name in TELEGRAM_BOT_TOKEN WEBHOOK_SECRET ALLOWED_CHAT_IDS; do
            printf '%s' "${!name}" | run npx --yes wrangler@3 secret put "$name"
          done

      - name: Collega il bot Telegram al Worker
        if: steps.check.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          sub=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          if [ -z "$sub" ] || [ "$sub" = "null" ]; then
            echo "::error::Sottodominio workers.dev non trovato: apri Workers & Pages nella dashboard Cloudflare una volta per crearlo"
            exit 1
          fi
          url="https://flight-monitor-bot.$sub.workers.dev"
          echo "Worker: $url"
          tg="https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN"
          curl -sf "$tg/setWebhook" -H 'content-type: application/json' \
            -d "{\"url\":\"$url\",\"secret_token\":\"$WEBHOOK_SECRET\",\"allowed_updates\":[\"message\"],\"drop_pending_updates\":true}" | jq -e '.ok'
          node -e 'import("./bot/worker.js").then(m => console.log(JSON.stringify({commands: m.COMMANDS})))' > commands.json
          curl -sf "$tg/setMyCommands" -H 'content-type: application/json' -d @commands.json | jq -e '.ok'
          curl -sf "$tg/getWebhookInfo" | jq '.result | {url, pending_update_count, last_error_message}'
